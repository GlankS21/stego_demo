# Môi trường conda (thay thế cho: python -m venv .venv && pip install -r requirements.txt)
#   conda env create -f environment.yml
#   conda activate stego-demo
#   streamlit run app.py
name: stego-demo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
